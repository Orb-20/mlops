[project]
name = "adaptive-nlp-mlops"
version = "0.1.0"
description = "Adaptive social media sentiment & toxicity monitoring with embedding drift detection and gated retraining"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "scikit-learn==1.6.1",  # pinned: newer wheels blocked by Windows Smart App Control (see docs/limitations.md)
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyarrow==24.0.0",  # pinned: 25.x wheels blocked by Windows Smart App Control
    "mlflow>=2.16",
    "evidently>=0.4",
    "dvc>=3.50",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
    "streamlit>=1.37",
    "plotly>=5.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: needs a trained model or network; skipped in fast CI",
    "integration: touches the database/service layer",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mlruns", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
