name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      DISABLE_MONITOR_WORKER: "1"
      # CI never uses the live YouTube API; tests use mocked HTTP and the demo dataset.
      YOUTUBE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Dependency validation
        run: pip check

      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard

      - name: Format check (black)
        run: black --check src tests scripts dashboard

      - name: Data validation (curated regression suite + demo data)
        run: |
          python -m src.evaluation.regression --validate
          python scripts/seed_demo_data.py --n 300 --seed 42
          git diff --exit-code data/sample/youtube_comments.csv

      - name: Unit + regression-suite tests
        run: pytest tests/unit tests/regression -m "not slow" -q

      - name: API + integration tests
        run: pytest tests/api tests/integration -m "not slow" -q
