# Local stack:  docker compose up --build
#   Dashboard  http://localhost:8501
#   API        http://localhost:8000  (docs at /docs)
#   MLflow     http://localhost:5000
#   Postgres   localhost:5432 (user/pass mlops/mlops; DBs: mlops, mlflow)
#
# First run has no trained model. Bootstrap one (CPU; ~15-40 min depending on machine):
#   docker compose --profile bootstrap run --rm bootstrap

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops
  MLFLOW_TRACKING_URI: http://mlflow:5000
  ENVIRONMENT: docker
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-mlflow-db.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    build: .
    image: adaptive-nlp-mlops:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://mlops:mlops@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --allowed-hosts "*"
    volumes:
      - mlartifacts:/mlartifacts
    ports: ["5000:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    image: adaptive-nlp-mlops:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    volumes:
      - appdata:/app/artifacts
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      # /health answers 200 even when degraded (e.g. no production model yet)
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboard:
    image: adaptive-nlp-mlops:latest
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_healthy }

  bootstrap:
    image: adaptive-nlp-mlops:latest
    profiles: ["bootstrap"]
    command: python scripts/setup_local.py --max-train ${BOOTSTRAP_MAX_TRAIN:-4000} --epochs ${BOOTSTRAP_EPOCHS:-1}
    environment: *app-env
    volumes:
      - appdata:/app/artifacts
    depends_on:
      mlflow: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  mlartifacts:
  appdata:
