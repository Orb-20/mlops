      size: 2625
    params:
      configs/config.yaml:
        data:
          sentiment:
            hf_dataset: cardiffnlp/tweet_eval
            hf_config: sentiment
            labels:
            - negative
            - neutral
            - positive
            max_train: 12000
            max_val: 2000
