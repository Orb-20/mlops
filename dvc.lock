            - severe_toxic
            - obscene
            - threat
            - insult
            - identity_hate
            labels:
            - safe
            - toxic
            max_total: 20000
            split:
              train: 0.7
              val: 0.1
              test: 0.2
          text:
            min_chars: 2
            max_chars: 2000
        project.seed: 42
